# Integración continua: compila y corre las pruebas con GCC y Clang en Linux
# y con GCC de MSYS2 en Windows, en cada PR y en cada push a main. Nunca usa
# una API key ni llama a una API real:
# las pruebas usan FakeTransport y el único arranque del ejecutable es sin key.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.compiler }} / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc, preset: dev }
          - { compiler: gcc, preset: asan }
          - { compiler: gcc, preset: tsan }
          - { compiler: gcc, preset: release }
          - { compiler: clang, preset: dev }
          - { compiler: clang, preset: release }
    env:
      CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
      CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Ubuntu 24.04 trae Catch2 3.4 (find_package(Catch2 3) la acepta).
      # FTXUI y md4c se descargan solos por FetchContent al configurar.
      # tzdata: la base de zonas de C++20 (std::chrono::locate_zone) del tope
      # diario del addon de Telegram, que en Linux se compila por defecto.
      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ clang libcurl4-openssl-dev nlohmann-json3-dev catch2 tzdata

      # Con vm.mmap_rnd_bits=32 (kernels recientes), TSan falla con
      # "FATAL: ThreadSanitizer: unexpected memory mapping".
      - name: Ajustar ASLR para ThreadSanitizer
        if: matrix.preset == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configurar
        run: cmake --preset ${{ matrix.preset }}

      - name: Compilar
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Pruebas
        run: |
          if [ "${{ matrix.preset }}" = "release" ]; then
            export CHATBOT_STRICT_PERF=1
          fi
          ctest --preset ${{ matrix.preset }} --output-on-failure

      # Sin CHAT_API_KEY el programa debe salir con código 1 y el error de
      # configuración, sin abrir la interfaz ni conectarse a nada.
      - name: Arranque sin API key
        run: |
          status=0
          env -u CHAT_API_KEY ./build/${{ matrix.preset }}/cli/chatbot \
            < /dev/null > salida.txt 2> errores.txt || status=$?
          cat errores.txt
          if [ "$status" -ne 1 ]; then
            echo "Se esperaba el código de salida 1 y fue $status"
            exit 1
          fi
          grep -q "error de configuración" errores.txt
          grep -q "CHAT_API_KEY" errores.txt

      # chatbot-rpc sin configuración (HOME vacío): initialize responde con
      # "ready":false y shutdown + exit salen con 0. Nunca toca la red.
      - name: Arranque de chatbot-rpc sin configuración
        run: |
          mkdir -p "$RUNNER_TEMP/rpc-home"
          status=0
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocol_version":1}}' \
            '{"jsonrpc":"2.0","id":2,"method":"shutdown","params":{}}' \
            '{"jsonrpc":"2.0","method":"exit"}' \
            | env -u CHAT_API_KEY -u XDG_CONFIG_HOME -u XDG_DATA_HOME HOME="$RUNNER_TEMP/rpc-home" \
              ./build/${{ matrix.preset }}/cli/chatbot-rpc > salida-rpc.txt 2> errores-rpc.txt \
            || status=$?
          cat salida-rpc.txt errores-rpc.txt
          if [ "$status" -ne 0 ]; then
            echo "Se esperaba el código de salida 0 y fue $status"
            exit 1
          fi
          grep -q '"ready":false' salida-rpc.txt

      # El bot, por "chatbot telegram" (lo busca junto a chatbot), sin red:
      # --config-version; desactivado (sin sección) sale con 0; activado sin
      # token, con 78. HOME propio y sin las CHAT_* del bot.
      - name: Arranque del bot sin configuración ni token
        run: |
          chatbot="$PWD/build/${{ matrix.preset }}/cli/chatbot"
          test "$("$chatbot" telegram --config-version)" = 1
          export HOME="$PWD/casa"
          mkdir -p "$HOME"
          unset XDG_CONFIG_HOME XDG_DATA_HOME CHAT_TELEGRAM_TOKEN CHAT_API_KEY CHAT_SEARCH_API_KEY
          status=0
          "$chatbot" telegram < /dev/null 2> errores.txt || status=$?
          cat errores.txt
          test "$status" -eq 0
          grep -q "desactivado" errores.txt
          mkdir -p "$HOME/.config/chatbot"
          echo '{"addons": {"telegram": {"version": 1, "enabled": true}}}' \
            > "$HOME/.config/chatbot/config.json"
          status=0
          "$chatbot" telegram < /dev/null 2> errores.txt || status=$?
          cat errores.txt
          test "$status" -eq 78
          grep -q "Falta el token de Telegram" errores.txt

  # Sin addons: con CHATBOT_BUILD_TELEGRAM=OFF la app compila y pasa sus
  # pruebas sin addons/telegram ni addons/common, y "chatbot telegram" dice
  # que no está instalado (69).
  no-addons:
    name: gcc / dev sin addons
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libcurl4-openssl-dev nlohmann-json3-dev catch2

      - name: Configurar
        run: cmake --preset dev -DCHATBOT_BUILD_TELEGRAM=OFF

      - name: Compilar
        run: cmake --build --preset dev

      - name: Pruebas
        run: ctest --preset dev --output-on-failure

      - name: chatbot telegram sin el addon
        run: |
          status=0
          PATH=/usr/bin:/bin ./build/dev/cli/chatbot telegram 2> errores.txt || status=$?
          cat errores.txt
          test "$status" -eq 69
          grep -q "No encontré chatbot-telegram" errores.txt

  # Windows con MSYS2 UCRT64 y GCC, con los mismos flags y -Werror. Solo dev y
  # release: asan y tsan son de Linux. Sin CHATBOT_STRICT_PERF: los tiempos de
  # los runners de Windows varían demasiado (la latencia de cancelación < 2 s
  # se exige igual, siempre).
  windows:
    name: windows / ${{ matrix.preset }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, release]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Sin cambiar core.autocrlf: .gitattributes fija los saltos de línea, y
      # así se prueba lo que obtiene quien clona con Git for Windows.
      - name: Checkout
        uses: actions/checkout@v7

      # FTXUI y md4c se descargan solos por FetchContent al configurar.
      - name: Instalar MSYS2 (UCRT64) y dependencias
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-catch

      # Versión de libcurl y su backend TLS (curl_version_info), para el
      # informe: CURLSSLOPT_NATIVE_CA necesita OpenSSL o Schannel.
      - name: Versión de curl
        run: curl -V

      - name: Configurar
        run: cmake --preset ${{ matrix.preset }}

      - name: Compilar
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Pruebas
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      # chatbot-rpc.exe con pipes de Windows de verdad (MSYS2 se los conecta
      # al .exe nativo): ciclo de vida, sin \r, \r\n en la entrada, UTF-8, EOF
      # y stdout solo del protocolo (tools/check-rpc-pipes.sh). Una copia con
      # chatbot.portable, para no tocar el AppData del runner.
      - name: chatbot-rpc con pipes
        run: |
          rm -rf rpc-prueba
          mkdir rpc-prueba
          cp build/${{ matrix.preset }}/cli/chatbot-rpc.exe rpc-prueba/
          touch rpc-prueba/chatbot.portable
          tools/check-rpc-pipes.sh rpc-prueba/chatbot-rpc.exe windows

      # Sin CHAT_API_KEY debe salir con código 1 y el error de configuración.
      # stdin es NUL: GetConsoleMode falla y no se abre la interfaz. El
      # timeout evita que la CI se cuelgue si algún día no fuera así.
      - name: Arranque sin API key
        run: |
          status=0
          env -u CHAT_API_KEY timeout 60 ./build/${{ matrix.preset }}/cli/chatbot.exe \
            < /dev/null > salida.txt 2> errores.txt || status=$?
          cat errores.txt
          if [ "$status" -ne 1 ]; then
            echo "Se esperaba el código de salida 1 y fue $status"
            exit 1
          fi
          grep -q "error de configuración" errores.txt
          grep -q "CHAT_API_KEY" errores.txt

      # El ZIP de distribución (tools/package-windows.sh): chatbot.exe y
      # chatbot-rpc.exe con las DLL de /ucrt64/bin que reporta ldd, LICENSE.txt,
      # AVISOS-TERCEROS.txt, LEEME.txt y chatbot.portable.ejemplo. El script
      # falla si falta el texto de alguna licencia o si el ZIP no trae
      # exactamente esos archivos.
      - name: Empaquetar
        if: matrix.preset == 'release'
        run: tools/package-windows.sh build/release build/chatbot-windows-x64.zip

      # Desde la carpeta descomprimida y sin /ucrt64/bin en el PATH, como en
      # una PC sin MSYS2: sin key y sin terminal sale con 1 y el error de
      # configuración; con chatbot.portable, igual, pero crea datos/ ahí.
      # chatbot-rpc.exe: initialize, shutdown y exit → 0; con chatbot.portable,
      # tools/check-rpc-pipes.sh completo (portable:true y config en datos\).
      - name: Probar el ZIP
        if: matrix.preset == 'release'
        run: |
          set -euo pipefail
          rm -rf zip-prueba
          mkdir zip-prueba
          cd zip-prueba
          cmake -E tar xf ../build/chatbot-windows-x64.zip
          ls -l
          arrancar() {
            local status=0
            env -u CHAT_API_KEY -u CHAT_DATA_DIR PATH=/usr/bin:/c/Windows/System32:/c/Windows \
              timeout 60 ./chatbot.exe < /dev/null > ../salida-zip.txt 2> ../errores-zip.txt ||
              status=$?
            cat ../errores-zip.txt
            if [ "$status" -ne 1 ]; then
              echo "Se esperaba el código de salida 1 y fue $status"
              exit 1
            fi
            grep -q "error de configuración" ../errores-zip.txt
            grep -q "CHAT_API_KEY" ../errores-zip.txt
          }
          arrancar
          status=0
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocol_version":1,"client":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"shutdown","params":{}}' \
            '{"jsonrpc":"2.0","method":"exit"}' |
            env -u CHAT_API_KEY -u CHAT_DATA_DIR PATH=/usr/bin:/c/Windows/System32:/c/Windows \
              timeout 60 ./chatbot-rpc.exe 2> ../errores-rpc.txt | cat > ../salida-rpc.txt ||
            status=$?
          cat ../errores-rpc.txt
          cut -c1-200 ../salida-rpc.txt
          if [ "$status" -ne 0 ]; then
            echo "chatbot-rpc.exe: se esperaba el código de salida 0 y fue $status"
            exit 1
          fi
          grep -q '"portable":false' ../salida-rpc.txt
          grep -q '"jsonrpc":"2.0","id":2,"result":{}' ../salida-rpc.txt
          test ! -e datos
          cp chatbot.portable.ejemplo chatbot.portable
          arrancar
          test -d datos
          if grep -q "Modo portable" ../errores-zip.txt; then
            echo "datos/ se podía escribir y aun así salió el error del modo portable"
            exit 1
          fi
          PATH=/usr/bin:/c/Windows/System32:/c/Windows \
            ../tools/check-rpc-pipes.sh ./chatbot-rpc.exe windows

      - name: Subir el artefacto
        if: matrix.preset == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: chatbot-windows-x64
          path: build/chatbot-windows-x64.zip
          if-no-files-found: error
